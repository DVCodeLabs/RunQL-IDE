name: Test Trusted Signing

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-sign:
    runs-on: windows-latest
    environment: release
    steps:
      - name: Create unsigned test binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signing-test -Force | Out-Null
          New-Item -ItemType Directory -Path hello-src -Force | Out-Null
          Push-Location hello-src
          dotnet new console -n HelloSign --force | Out-Null
          Push-Location HelloSign
          dotnet publish -c Release -r win-x64 --self-contained false -o ..\..\signing-test | Out-Null
          Pop-Location
          Pop-Location
          Get-ChildItem signing-test\HelloSign.exe | Format-List Name, Length, FullName

      - name: Confirm binary is unsigned before signing
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signing-test\HelloSign.exe
          Write-Host "Status before signing: $($sig.Status)"
          if ($sig.Status -eq 'Valid') {
            Write-Error "Test binary is already signed; test would be inconclusive."
            exit 1
          }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Trusted Signing
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: signing-test
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signing-test\HelloSign.exe
          Write-Host "Status:            $($sig.Status)"
          Write-Host "StatusMessage:     $($sig.StatusMessage)"
          Write-Host "Signer Subject:    $($sig.SignerCertificate.Subject)"
          Write-Host "Signer Issuer:     $($sig.SignerCertificate.Issuer)"
          Write-Host "Signer NotBefore:  $($sig.SignerCertificate.NotBefore)"
          Write-Host "Signer NotAfter:   $($sig.SignerCertificate.NotAfter)"
          Write-Host "Timestamp Subject: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Signature is not valid: $($sig.Status) - $($sig.StatusMessage)"
            exit 1
          }

      - name: Upload signed test binary
        uses: actions/upload-artifact@v4
        with:
          name: signed-test-exe
          path: signing-test/HelloSign.exe
          retention-days: 7
